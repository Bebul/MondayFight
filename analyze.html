<!DOCTYPE html>
<html lang="cs">
<head>
    <meta name="viewport" content="height=device-height, width=device-width, initial-scale=1.0, minimum-scale=1.0, target-densitydpi=device-dpi"/>
    <meta http-equiv="Cache-Control" content="max-age=3600" />
    <meta charset="UTF-8">
    <title>"Monday Fight Leaderboard"</title>
    <link href="dist/css/tabulator.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png"/>

    <script type="text/javascript" src="pgn/pgn-bundle.js"></script>

    <script type="text/javascript" src="js/minimal.js"></script>
    <script defer src="js/menu.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/mf.css">
</head>

<body>

<div class="body">

    <div class="mondayFightCaption">
        <img src="img/pohar.png" style="position: absolute; z-index: -1; height:80px; float:left; margin:-2px -20px 0 0px"/>
        <span class="icon">
            <button class="menu-toggle" type="button" data-mf-menu-toggle aria-controls="myLinks" aria-expanded="false" aria-label="Otevřít navigační menu">
                <i class="fa fa-bars hamburger" aria-hidden="true"></i>
            </button>
        </span>
        <span class="captionText">Analyze Games</span>
        <div class="topnav">
            <div id="myLinks" data-mf-menu hidden></div>
        </div>
    </div>

    <div class="article first" style="margin-top: 30px">
    </div>

</div>

<script type="module">
  import {processAnalyze} from "./js/analyze.mjs"
  import {LoadMFData} from "./js/tournamentsData.mjs"

  function mainPage(data) {
    processAnalyze(data)
  }
  LoadMFData(mainPage)
</script>

</body>
</html>
